name: Security Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact locked dependencies
        run: npm ci --ignore-scripts --no-audit
      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high

  compatibility-probe:
    name: Patched dependency compatibility probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/etken_test?schema=public
      DIRECT_URL: postgresql://test:test@127.0.0.1:5432/etken_test?schema=public
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test updated transitive dependencies without committing changes
        run: |
          npm pkg set 'overrides.deepmerge-ts=^8.0.0' 'overrides.uuid=^11.1.1'
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci --no-audit
          npx prisma generate
          npm audit --omit=dev --audit-level=high
          npm run lint:tests
          npx tsc --noEmit
          npm run test:coverage
          npm run build

  persist-verified-lockfile:
    name: Persist validated dependency overrides
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/automated-audit-20261010
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Update dependency overrides and lockfile
        run: |
          npm pkg set 'overrides.deepmerge-ts=^8.0.0' 'overrides.uuid=^11.1.1'
          npm install --package-lock-only --ignore-scripts --no-audit
      - name: Commit verified dependency lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(security): pin validated patched transitive dependencies"
          git push origin HEAD:security/automated-audit-20261010

  live-security:
    name: Public HTTPS and security headers
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify live security headers and public endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error, ssl, sys
          url="https://etkenofis.com/"
          req=urllib.request.Request(url,headers={"User-Agent":"Etken-Security-Audit/1.0"})
          with urllib.request.urlopen(req,timeout=20,context=ssl.create_default_context()) as res:
              headers=res.headers
              print("HTTPS status:",res.status)
              assert res.status == 200, "Homepage did not return HTTP 200"
              for name in ("Strict-Transport-Security","Content-Security-Policy","X-Content-Type-Options","X-Frame-Options","Referrer-Policy","Permissions-Policy"):
                  value=headers.get(name)
                  print(name+":", "present" if value else "MISSING")
                  assert value, name+" missing"
              assert "max-age=" in headers["Strict-Transport-Security"].lower()
              assert "object-src 'none'" in headers["Content-Security-Policy"]
              assert headers["X-Content-Type-Options"].lower()=="nosniff"
              assert headers["X-Frame-Options"].upper()=="DENY"
          with urllib.request.urlopen("https://etkenofis.com/api/health",timeout=20,context=ssl.create_default_context()) as res:
              print("Health status:",res.status)
              assert res.status==200
          PY
