name: Catalog CSV Validation

on:
  pull_request:
    paths:
      - "scripts/catalog/**"
      - ".github/workflows/catalog-csv-validation.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/catalog/**"
      - ".github/workflows/catalog-csv-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Offline Zırhlı CSV regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline CSV validator regression tests
        run: python -m unittest discover -s scripts/catalog -p 'test_*.py' -v
